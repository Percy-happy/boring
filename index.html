<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杀死火柴人 - 物理游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        
        #game-container {
            position: relative;
            border: 3px solid #ecf0f1;
            border-radius: 8px;
            background: #1a2530;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #c0392b;
        }
        
        #health-bar {
            width: 300px;
            height: 20px;
            background: #34495e;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 15px;
        }
        
        #health-fill {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.3s;
        }
        
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
            text-align: center;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 2px 2px 4px #000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-over">游戏结束!</div>
    </div>
    
    <div class="controls">
        <button id="reset-btn">重置游戏</button>
        <div id="health-bar">
            <div id="health-fill"></div>
        </div>
        <button id="explode-btn">点击爆炸</button>
    </div>
    
    <div class="instructions">
        操作说明: 1. 点击屏幕生成爆炸 2. 拖拽鼠标投掷物体 3. 攻击火柴人减少生命值
    </div>

    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <script>
        // 初始化Matter.js引擎
        const { Engine, World, Bodies, Body, Events, Vector, Composite } = Matter;
        
        // 游戏参数
        const config = {
            width: 800,
            height: 600,
            gravity: 0.8,
            stickmanHealth: 100,
            explosionForce: 0.05,
            throwForce: 0.1
        };
        
        // 初始化游戏
        let engine, world, canvas, ctx;
        let stickman = null;
        let health = config.stickmanHealth;
        let gameOver = false;
        
        // DOM元素
        const healthFill = document.getElementById('health-fill');
        const gameOverText = document.getElementById('game-over');
        const resetBtn = document.getElementById('reset-btn');
        const explodeBtn = document.getElementById('explode-btn');
        
        // 初始化画布和物理引擎
        function initGame() {
            // 重置状态
            health = config.stickmanHealth;
            gameOver = false;
            gameOverText.style.display = 'none';
            updateHealthBar();
            
            // 创建引擎
            engine = Engine.create();
            engine.gravity.y = config.gravity;
            world = engine.world;
            
            // 获取画布
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // 创建边界
            createBounds();
            
            // 创建火柴人
            createStickman();
            
            // 启动引擎
            Engine.run(engine);
            
            // 渲染循环
            render();
            
            // 添加事件监听
            addEventListeners();
        }
        
        // 创建游戏边界
        function createBounds() {
            const thickness = 50;
            const bounds = [
                // 地面
                Bodies.rectangle(config.width/2, config.height + thickness/2, config.width, thickness, { 
                    isStatic: true, 
                    render: { fillStyle: '#7f8c8d' } 
                }),
                // 左墙
                Bodies.rectangle(-thickness/2, config.height/2, thickness, config.height, { 
                    isStatic: true, 
                    render: { fillStyle: '#7f8c8d' } 
                }),
                // 右墙
                Bodies.rectangle(config.width + thickness/2, config.height/2, thickness, config.height, { 
                    isStatic: true, 
                    render: { fillStyle: '#7f8c8d' } 
                }),
                // 天花板
                Bodies.rectangle(config.width/2, -thickness/2, config.width, thickness, { 
                    isStatic: true, 
                    render: { fillStyle: '#7f8c8d' } 
                })
            ];
            
            World.add(world, bounds);
        }
        
        // 创建火柴人（由多个物理体组成）
        function createStickman() {
            if (stickman) {
                Composite.remove(world, stickman);
            }
            
            const stickmanParts = [];
            const x = config.width/2;
            const y = config.height/2 - 100;
            
            // 头部
            const head = Bodies.circle(x, y, 25, {
                density: 0.001,
                friction: 0.5,
                restitution: 0.2,
                label: 'stickman'
            });
            
            // 身体
            const body = Bodies.rectangle(x, y + 50, 10, 80, {
                density: 0.001,
                friction: 0.5,
                restitution: 0.2,
                label: 'stickman'
            });
            
            // 左臂
            const leftArm = Bodies.rectangle(x - 20, y + 30, 60, 8, {
                density: 0.001,
                friction: 0.5,
                restitution: 0.2,
                label: 'stickman'
            });
            
            // 右臂
            const rightArm = Bodies.rectangle(x + 20, y + 30, 60, 8, {
                density: 0.001,
                friction: 0.5,
                restitution: 0.2,
                label: 'stickman'
            });
            
            // 左腿
            const leftLeg = Bodies.rectangle(x - 15, y + 90, 70, 8, {
                density: 0.001,
                friction: 0.5,
                restitution: 0.2,
                label: 'stickman'
            });
            
            // 右腿
            const rightLeg = Bodies.rectangle(x + 15, y + 90, 70, 8, {
                density: 0.001,
                friction: 0.5,
                restitution: 0.2,
                label: 'stickman'
            });
            
            // 组合火柴人部件
            stickman = Composite.create();
            Composite.add(stickman, [head, body, leftArm, rightArm, leftLeg, rightLeg]);
            
            // 添加关节连接部件
            const joints = [
                Matter.Constraint.create({ bodyA: head, bodyB: body, pointA: { x: 0, y: 25 }, pointB: { x: 0, y: -40 }, stiffness: 0.9 }),
                Matter.Constraint.create({ bodyA: body, bodyB: leftArm, pointA: { x: -5, y: -20 }, pointB: { x: 20, y: 0 }, stiffness: 0.9 }),
                Matter.Constraint.create({ bodyA: body, bodyB: rightArm, pointA: { x: 5, y: -20 }, pointB: { x: -20, y: 0 }, stiffness: 0.9 }),
                Matter.Constraint.create({ bodyA: body, bodyB: leftLeg, pointA: { x: -5, y: 30 }, pointB: { x: 20, y: 0 }, stiffness: 0.9 }),
                Matter.Constraint.create({ bodyA: body, bodyB: rightLeg, pointA: { x: 5, y: 30 }, pointB: { x: -20, y: 0 }, stiffness: 0.9 })
            ];
            
            Composite.add(stickman, joints);
            World.add(world, stickman);
        }
        
        // 渲染游戏画面
        function render() {
            // 清空画布
            ctx.clearRect(0, 0, config.width, config.height);
            
            // 绘制背景
            ctx.fillStyle = '#1a2530';
            ctx.fillRect(0, 0, config.width, config.height);
            
            // 绘制所有物理体
            World.getAllBodies(world).forEach(body => {
                if (body.label === 'stickman') {
                    // 绘制火柴人（黑色）
                    ctx.fillStyle = '#ecf0f1';
                    ctx.strokeStyle = '#ecf0f1';
                    ctx.lineWidth = 2;
                } else if (body.label === 'projectile') {
                    // 绘制投掷物（红色）
                    ctx.fillStyle = '#e74c3c';
                    ctx.strokeStyle = '#c0392b';
                    ctx.lineWidth = 2;
                } else if (body.label === 'explosion') {
                    // 绘制爆炸效果（黄色）
                    ctx.fillStyle = '#f1c40f';
                    ctx.strokeStyle = '#f39c12';
                    ctx.lineWidth = 1;
                } else {
                    // 绘制边界
                    ctx.fillStyle = '#7f8c8d';
                    ctx.strokeStyle = '#616a6b';
                    ctx.lineWidth = 1;
                }
                
                // 绘制物理体
                ctx.beginPath();
                body.vertices.forEach(vertex => {
                    ctx.lineTo(vertex.x, vertex.y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });
            
            // 检查游戏结束
            if (health <= 0 && !gameOver) {
                gameOver = true;
                gameOverText.style.display = 'block';
            }
            
            // 继续渲染循环
            requestAnimationFrame(render);
        }
        
        // 添加事件监听
        function addEventListeners() {
            // 鼠标点击爆炸
            canvas.addEventListener('click', (e) => {
                if (gameOver) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                createExplosion(x, y);
                
                // 减少火柴人生命值
                decreaseHealth(5);
            });
            
            // 爆炸按钮
            explodeBtn.addEventListener('click', () => {
                if (gameOver) return;
                
                // 在火柴人位置创建爆炸
                if (stickman) {
                    const head = stickman.bodies.find(body => body.circleRadius);
                    if (head) {
                        createExplosion(head.position.x, head.position.y);
                        decreaseHealth(10);
                    }
                }
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', () => {
                // 清除现有世界
                World.clear(world);
                Engine.clear(engine);
                
                // 重新初始化游戏
                initGame();
            });
            
            // 拖拽投掷物体
            let isDragging = false;
            let startX, startY;
            
            canvas.addEventListener('mousedown', (e) => {
                if (gameOver) return;
                
                const rect = canvas.getBoundingClientRect();
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;
                isDragging = true;
            });
            
            canvas.addEventListener('mouseup', (e) => {
                if (!isDragging || gameOver) return;
                
                const rect = canvas.getBoundingClientRect();
                const endX = e.clientX - rect.left;
                const endY = e.clientY - rect.top;
                
                // 计算投掷方向和力度
                const dx = startX - endX;
                const dy = startY - endY;
                const force = Math.sqrt(dx*dx + dy*dy) * config.throwForce;
                
                // 创建投掷物
                createProjectile(startX, startY, dx, dy, force);
                
                isDragging = false;
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (isDragging && !gameOver) {
                    // 绘制拖拽轨迹（可选）
                    const rect = canvas.getBoundingClientRect();
                    const currentX = e.clientX - rect.left;
                    const currentY = e.clientY - rect.top;
                    
                    // 临时绘制拖拽线
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(currentX, currentY);
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });
        }
        
        // 创建爆炸效果
        function createExplosion(x, y) {
            // 创建爆炸视觉效果
            const explosion = Bodies.circle(x, y, 30, {
                isStatic: false,
                label: 'explosion',
                density: 0.0001,
                friction: 0,
                restitution: 0.9,
                lifespan: 1000 // 毫秒
            });
            
            World.add(world, explosion);
            
            // 移除爆炸效果
            setTimeout(() => {
                World.remove(world, explosion);
            }, 1000);
            
            // 给周围物体施加爆炸力
            World.getAllBodies(world).forEach(body => {
                if (body.label === 'stickman' || body.label === 'projectile') {
                    const dx = body.position.x - x;
                    const dy = body.position.y - y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distance < 200) {
                        const force = (1 - distance/200) * config.explosionForce;
                        Body.applyForce(body, body.position, {
                            x: (dx/distance) * force,
                            y: (dy/distance) * force
                        });
                    }
                }
            });
        }
        
        // 创建投掷物
        function createProjectile(x, y, dx, dy, force) {
            // 创建投掷物（方形）
            const projectile = Bodies.rectangle(x, y, 20, 20, {
                density: 0.01,
                friction: 0.3,
                restitution: 0.5,
                label: 'projectile'
            });
            
            World.add(world, projectile);
            
            // 施加投掷力
            Body.applyForce(projectile, { x, y }, {
                x: -dx/100 * force,
                y: -dy/100 * force
            });
            
            // 5秒后移除投掷物
            setTimeout(() => {
                World.remove(world, projectile);
            }, 5000);
        }
        
        // 减少生命值
        function decreaseHealth(amount) {
            if (gameOver) return;
            
            health = Math.max(0, health - amount);
            updateHealthBar();
        }
        
        // 更新生命值条
        function updateHealthBar() {
            const percentage = (health / config.stickmanHealth) * 100;
            healthFill.style.width = `${percentage}%`;
            
            // 改变生命值条颜色
            if (percentage > 60) {
                healthFill.style.background = '#2ecc71';
            } else if (percentage > 30) {
                healthFill.style.background = '#f39c12';
            } else {
                healthFill.style.background = '#e74c3c';
            }
        }
        
        // 启动游戏
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
